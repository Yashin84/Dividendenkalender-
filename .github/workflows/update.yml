name: Dividenden Kalender aktualisieren

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Skript ausführen
        run: python dividenden.py

      - name: Kalender speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisches Update des Dividenden-Kalenders"
          file_pattern: dividenden.ics
          
